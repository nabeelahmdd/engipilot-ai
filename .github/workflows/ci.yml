name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python • lint, types, tests, database
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://engipilot:ci_only@127.0.0.1:5432/engipilot
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: engipilot
          POSTGRES_USER: engipilot
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U engipilot -d engipilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.13.7"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Verify committed lockfile
        run: test -s uv.lock
      - name: Install exact dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run --locked ruff check .
      - name: Ruff format
        run: uv run --locked ruff format --check .
      - name: Mypy
        run: uv run --locked mypy src
      - name: Pytest
        run: uv run --locked pytest -q
      - name: Database smoke test
        run: uv run --locked python scripts/check_database.py

  frontend:
    name: Web • lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Verify committed lockfile
        run: test -s package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build

  images:
    name: Docker • build images (no push)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        component: [api, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f Dockerfile.${{ matrix.component }} -t engipilot-${{ matrix.component }}:ci .
